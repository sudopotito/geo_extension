name: Build Container Image

on:
  push:
    branches: [main]          # only run AFTER changes land in main (e.g. Merge PR)

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image coordinates (lowercase for GHCR)
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set branches, tags & apps.json (ERPNext + geo_extension)
        env:
          # On push to main, this will be "main"
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          # Production: always build on ERPNext / Frappe v15
          FRAPPE_BRANCH="version-15"

          # Image tags: we want "main" + "stable"
          IMAGE_MAIN_TAG="main"
          STABLE_TAG="stable"

          # apps.json: ERPNext + this repo (geo_extension), using main branch
          APPS_JSON=$(printf '[{"url":"https://github.com/frappe/erpnext","branch":"%s"},{"url":"https://github.com/%s","branch":"%s"}]' \
            "$FRAPPE_BRANCH" \
            "$REPOSITORY" \
            "$REF_NAME")

          echo "FRAPPE_BRANCH=${FRAPPE_BRANCH}" >> $GITHUB_ENV
          echo "IMAGE_MAIN_TAG=${IMAGE_MAIN_TAG}" >> $GITHUB_ENV
          echo "STABLE_TAG=${STABLE_TAG}" >> $GITHUB_ENV
          echo "APPS_JSON_BASE64=$(printf '%s' "$APPS_JSON" | base64 -w 0)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frappe_docker (for layered Containerfile)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64,linux/arm64

          # We only have push->main events now, but keep this guard for safety
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_MAIN_TAG }}
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.STABLE_TAG }}
